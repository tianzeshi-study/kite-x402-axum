[package]
name = "kite-x402-axum"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "x402 payment wrapper middleware for Axum, settled on the Kite chain (kite-x402-services Rust/Axum template)"
readme = "README.md"
keywords = ["x402", "axum", "kite", "payments", "middleware"]
categories = ["web-programming::http-server", "network-programming"]

[dependencies]
# Kept minimal: this is a middleware/proxy library, not a server. Consumers
# that call `axum::serve` (see `service/`) pull in "http1"/"tokio" themselves.
axum = { version = "0.8", default-features = false, features = ["json", "original-uri"] }
reqwest = { version = "=0.12.9", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1"

[dev-dependencies]
# Tests spin up real mock HTTP servers (facilitator + upstream), which needs
# axum::serve; union with the [dependencies] entry above adds it just for
# `cargo test`.
axum = { version = "0.8", default-features = false, features = ["json", "original-uri", "http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
