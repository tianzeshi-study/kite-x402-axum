# cargo-deny policy. Run locally with `cargo deny check`.
# Advisories are also covered by .github/workflows/audit.yml (cargo-audit);
# this adds license, ban and source checks.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

# Transitive dependency of sqlx-core via hashbrown.
[[licenses.exceptions]]
crate = "foldhash@0.1.5"
allow = ["Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
