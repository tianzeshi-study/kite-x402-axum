name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch / PR supersedes the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (unit + integration + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Runs the whole workspace: the library's unit + integration tests, the
      # service's unit tests, and `service/tests/e2e.rs`, which spawns the real
      # `kite-x402-service` binary. Everything talks to localhost mocks, so no
      # secrets or external network access are needed.
      - run: cargo test --workspace --locked

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with `workspace.package.rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  package:
    name: cargo package (kite-x402-axum)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Builds the crate from the tarball that `cargo publish` would upload,
      # which catches missing files and manifest mistakes before a release.
      - run: cargo package -p kite-x402-axum --locked

  scripts:
    name: python client script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install eth-account requests
      - run: python -m py_compile service/scripts/kite_x402_client.py
      - run: python -m unittest discover -s service/scripts -p 'test_kite_x402_client.py'


  kx402:
    name: kx402 client contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p kite-x402-service --locked
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Check out the kx402 client at a pinned tag
        uses: actions/checkout@v4
        with:
          repository: wilsonqc223/kite-x402-client
          ref: v0.1.0
          path: kx402-client
      - name: Pay the service end to end (mock facilitator)
        run: go run ./examples/e2e-axum-service -bin ../kite-x402-axum/target/release/kite-x402-service
        working-directory: kx402-client

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: kite-compose-smoke
      PAY_TO: '0x1111111111111111111111111111111111111111'
      UPSTREAM_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      - name: Reject missing or empty deployment settings
        shell: bash
        run: |
          for variable in PAY_TO UPSTREAM_URL; do
            for mode in unset empty; do
              if [[ "$mode" == unset ]]; then
                override=(-u "$variable")
              else
                override=("$variable=")
              fi
              if output=$(env "${override[@]}" docker compose --env-file /dev/null config --quiet 2>&1); then
                echo "Compose accepted $variable when $mode"
                exit 1
              fi
              if [[ "$output" != *"required variable $variable"* ]]; then
                printf 'Unexpected Compose error for %s (%s): %s\n' "$variable" "$mode" "$output"
                exit 1
              fi
            done
          done
      - name: Build and start the service
        run: docker compose --env-file /dev/null up --build --wait --wait-timeout 60
      - name: Check health and payment challenge
        run: |
          python3 - <<'PYTHON'
          import base64
          import http.client
          import json
          import os
          from contextlib import closing

          with closing(http.client.HTTPConnection("127.0.0.1", 8402, timeout=5)) as client:
              client.request("GET", "/healthz")
              with client.getresponse() as response:
                  if response.status != 200:
                      raise SystemExit(f"Expected HTTP 200 from /healthz, got {response.status}")
                  response.read()

              client.request("GET", "/v1/example")
              with client.getresponse() as response:
                  if response.status != 402:
                      raise SystemExit(f"Expected HTTP 402 from /v1/example, got {response.status}")
                  header = response.getheader("PAYMENT-REQUIRED")
                  if not header:
                      raise SystemExit("Missing PAYMENT-REQUIRED header")
                  challenge = json.loads(base64.b64decode(header, validate=True))
                  if challenge["accepts"][0]["payTo"] != os.environ["PAY_TO"]:
                      raise SystemExit("Payment challenge does not use the configured PAY_TO")
          PYTHON
      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file /dev/null logs --no-color
      - name: Stop the service
        if: always()
        run: docker compose --env-file /dev/null down

  docker:
    name: docker build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: kite-x402-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image must start with only the two required variables and report
      # healthy. Nothing here needs secrets or external network access.
      - name: Start container and wait for /healthz
        run: |
          docker run -d --name svc -p 8402:8402 \
            -e PAY_TO=0x0000000000000000000000000000000000000001 \
            -e UPSTREAM_URL=http://127.0.0.1:9 \
            kite-x402-service:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8402/healthz; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "service did not become healthy" >&2
          docker logs svc >&2
          exit 1
      - name: Unpaid /v1 request is challenged with 402
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8402/v1/anything)
          test "$code" = "402" || { echo "expected 402, got $code" >&2; docker logs svc >&2; exit 1; }
      - name: Show logs on failure
        if: failure()
        run: docker logs svc || true

  deny:
    name: cargo-deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Policy lives in deny.toml. Advisories are checked by audit.yml, which
      # also runs on a schedule, so a new advisory never blocks unrelated PRs.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  # One stable name to mark as the required check in branch protection, so the
  # list of required jobs does not need editing whenever a job is added.
  ci-success:
    name: CI success
    if: always()
    needs: [fmt, clippy, test, msrv, docs, package, scripts, compose, deny, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
