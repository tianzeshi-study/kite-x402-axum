services:
  kite-x402-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kite-x402-axum-service
    environment:
      - PORT=8402
      - PAY_TO=${PAY_TO:?Set PAY_TO to your Kite wallet address}
      - UPSTREAM_URL=${UPSTREAM_URL:?Set UPSTREAM_URL to the API base URL}
      - PRICE_USD=0.001
      - ROUTE_PRICES_USD=${ROUTE_PRICES_USD:-}
      - KITE_NETWORK=testnet
      - FACILITATOR_URL=https://facilitator.pieverse.io/v2
      - RUST_LOG=info
    ports:
      - "8402:8402"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8402/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
